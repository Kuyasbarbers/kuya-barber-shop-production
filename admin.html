<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kuya's Barber Shop - Admin</title>

  <style>
    :root {
      --brown-dark: #21140e;
      --brown: #4d2b1b;
      --gold: #d5a04b;
      --gold-light: #e8c477;
      --cream: #f5eee5;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: var(--brown-dark);
    }

    /* HEADER */
    .admin-header {
      background: var(--brown-dark);
      color: var(--gold-light);
      padding: 22px 35px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .admin-header h1 {
      margin: 0;
      font-size: 28px;
    }

    .admin-header p {
      margin: 5px 0 0;
      color: #ffffff;
      font-size: 14px;
    }

    .back-btn {
      background: var(--gold);
      color: #21140e;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: bold;
    }

    /* MAIN */
    .container {
      max-width: 1400px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .dashboard-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .dashboard-title h2 {
      margin-bottom: 8px;
      font-size: 30px;
    }

    .dashboard-title p {
      color: #765037;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--white);
      border: 1px solid #dfcfbd;
      border-bottom: 4px solid var(--gold);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(33, 20, 14, 0.08);
    }

    .stat-card h3 {
      margin: 0;
      font-size: 16px;
      color: #765037;
    }

    .stat-number {
      display: block;
      margin-top: 10px;
      font-size: 34px;
      font-weight: bold;
      color: var(--brown);
    }

    /* ACTIONS */
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .refresh-btn,
    .clear-btn {
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh-btn {
      background: var(--gold);
      color: var(--brown-dark);
    }

    .clear-btn {
      background: var(--brown);
      color: white;
    }

    /* TABLE */,    /* FILTERS */

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .filter-input,
    .filter-select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #dfcfbd;
      border-radius: 12px;
      background: #ffffff;
      color: var(--brown-dark);
      font-size: 15px;
      outline: none;
    }

    .filter-input:focus,
    .filter-select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(213, 160, 75, 0.15);
    }
    .table-box {
      background: var(--white);
      border: 1px solid #dfcfbd;
      border-radius: 18px;
      overflow-x: auto;
      box-shadow: 0 10px 30px rgba(33, 20, 14, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th {
      background: var(--brown-dark);
      color: var(--gold-light);
      padding: 16px 12px;
      text-align: left;
      font-size: 14px;
    }

    td {
      padding: 15px 12px;
      border-bottom: 1px solid #eadfd3;
      font-size: 14px;
    }

    tr:hover {
      background: #faf5ef;
    }

    .reference {
      font-weight: bold;
      color: var(--brown);
    }

    .branch {
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 50px;
      color: #765037;
      font-size: 18px;
    }

    /* MOBILE */
    @media (max-width: 700px) {

      .admin-header {
        padding: 18px;
        flex-direction: column;
        text-align: center;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    .filters {
      grid-template-columns: 1fr;
    }
      .container {
        padding: 0 12px;
      }

      .dashboard-title h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="admin-header">

    <div>
      <h1>KUYA'S BARBER SHOP</h1>
      <p>Admin Appointment Dashboard</p>
    </div>

    <a href="index.html" class="back-btn">
      BACK TO WEBSITE
    </a>

  </header>


  <!-- MAIN CONTENT -->
  <main class="container">

    <div class="dashboard-title">
      <h2>Appointment Management</h2>
      <p>View all appointments saved on this device.</p>
    </div>


    <!-- STATISTICS -->
    <div class="stats">

      <div class="stat-card">
        <h3>TOTAL APPOINTMENTS</h3>
        <span class="stat-number" id="totalAppointments">0</span>
      </div>

      <div class="stat-card">
        <h3>GOA BRANCH</h3>
        <span class="stat-number" id="goaAppointments">0</span>
      </div>

      <div class="stat-card">
        <h3>TIGAON BRANCH</h3>
        <span class="stat-number" id="tigaonAppointments">0</span>
      </div>

    </div>


    <!-- ACTIONS -->
    <div class="actions">

      <strong id="lastUpdated">
        Appointments
      </strong>

      <div>
        <button
          type="button"
          class="refresh-btn"
          onclick="loadAppointments()">
          REFRESH
        </button>

        <button
          type="button"
          class="clear-btn"
          onclick="clearAppointments()">
          CLEAR ALL
        </button>
      </div>

    </div>

    <!-- SEARCH AND FILTER -->

    <div class="filters">

      <input
        type="search"
        id="customerSearch"
        class="filter-input"
        placeholder="Search customer, mobile, or reference..."
      >

      <select
        id="branchFilter"
        class="filter-select">

        <option value="all">All Branches</option>
        <option value="Goa Branch">Goa Branch</option>
        <option value="Tigaon Branch">Tigaon Branch</option>

      </select>

    </div>

    
    <!-- APPOINTMENT TABLE -->
    <div class="table-box">

      <table>

        <thead>

          <tr>
            <th>Reference</th>
            <th>Customer</th>
            <th>Mobile</th>
            <th>Branch</th>
            <th>Service</th>
            <th>Date</th>
            <th>Time</th>
            <th>Barber</th>
          </tr>

        </thead>

        <tbody id="appointmentTable">

        </tbody>

      </table>

    </div>

  </main>


  <script>

    const STORAGE_KEY = "kuyaBarberAppointments";


    function loadAppointments() {

      const table = document.getElementById("appointmentTable");

      let appointments = [];

      try {

        appointments =
          JSON.parse(
            localStorage.getItem(STORAGE_KEY)
          ) || [];

      } catch (error) {

        appointments = [];

      }


      /* SORT NEWEST FIRST */

      appointments.sort(function(a, b) {

        return new Date(b.createdAt || 0)
          - new Date(a.createdAt || 0);

     });      /* SEARCH AND BRANCH FILTER */

      const searchInput =
        document.getElementById("customerSearch");

      const branchFilter =
        document.getElementById("branchFilter");

      const searchTerm =
        searchInput.value.trim().toLowerCase();

      const selectedBranch =
        branchFilter.value;

      appointments = appointments.filter(function(item) {

        const searchableText = [
          item.fullName,
          item.mobile,
          item.bookingReference
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        const matchesSearch =
          !searchTerm ||
          searchableText.includes(searchTerm);

        const matchesBranch =
          selectedBranch === "all" ||
          item.branch === selectedBranch;

        return matchesSearch && matchesBranch;

      });


      /* UPDATE STATISTICS */

      document.getElementById("totalAppointments")
        .textContent = appointments.length;

      document.getElementById("goaAppointments")
        .textContent =
          appointments.filter(function(item) {
            return item.branch === "Goa Branch";
          }).length;

      document.getElementById("tigaonAppointments")
        .textContent =
          appointments.filter(function(item) {
            return item.branch === "Tigaon Branch";
          }).length;


      /* EMPTY */

      if (appointments.length === 0) {

        table.innerHTML = `
          <tr>
            <td colspan="8" class="empty">
              No appointments found.
            </td>
          </tr>
        `;

        document.getElementById("lastUpdated")
          .textContent = "No appointments";

        return;
      }


      /* DISPLAY APPOINTMENTS */

      table.innerHTML = "";


      appointments.forEach(function(item) {

        const row = document.createElement("tr");

        row.innerHTML = `

          <td class="reference">
            ${safe(item.bookingReference)}
          </td>

          <td>
            ${safe(item.fullName)}
          </td>

          <td>
            ${safe(item.mobile)}
          </td>

          <td class="branch">
            ${safe(item.branch)}
          </td>

          <td>
            ${safe(item.service)}
          </td>

          <td>
            ${safe(item.date)}
          </td>

          <td>
            ${safe(item.time)}
          </td>

          <td>
            ${safe(item.barber)}
          </td>

        `;

        table.appendChild(row);

      });


      document.getElementById("lastUpdated")
        .textContent =
          appointments.length +
          " appointment(s) found";

    }


    /* SAFE DISPLAY */

    function safe(value) {

      if (value === undefined || value === null) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* CLEAR ALL APPOINTMENTS */

    function clearAppointments() {

      const confirmed =
        confirm(
          "Are you sure you want to delete ALL appointments saved on this device?"
        );

      if (!confirmed) {
        return;
      }

      localStorage.removeItem(STORAGE_KEY);

      loadAppointments();

      alert("All appointments have been cleared.");

    }


       /* SEARCH CUSTOMER */

    document
      .getElementById("customerSearch")
      .addEventListener("input", loadAppointments);


    /* FILTER BRANCH */

    document
      .getElementById("branchFilter")
      .addEventListener("change", loadAppointments);


    /* LOAD WHEN PAGE OPENS */

    loadAppointments();

    /* ADMIN LOGIN PROTECTION */

    if (sessionStorage.getItem("kuyaAdminLoggedIn") !== "true") {
      window.location.href = "login.html";
    }

</script>

</body>
</html>
